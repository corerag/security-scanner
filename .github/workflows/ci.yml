name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest -q

  build-exe:
    name: Build Windows agent .exe
    runs-on: windows-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone agent .exe
        run: >
          pyinstaller --onefile --console --name security-scan-agent
          --collect-all pydantic --collect-all pydantic_core
          --collect-all email_validator --collect-all certifi
          --clean --noconfirm
          agent_entry.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-agent-windows
          path: dist/security-scan-agent.exe
          if-no-files-found: error
          retention-days: 14
